name: Aura Protocol Tracker Bot

on:
  schedule:
    # Every 10 minutes -> combined-total update
    - cron: "*/10 * * * *"
    # Once a day at midnight UTC -> daily summary
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated state file back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-telegram-bot requests

      - name: Determine mode (update vs daily)
        id: mode
        run: |
          # If triggered by the midnight cron, run the daily summary.
          # Otherwise (the */10 cron, or a manual run), run the 10-min update.
          if [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=update" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tracker bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python aura_tracker_bot.py --mode ${{ steps.mode.outputs.mode }}

      - name: Commit updated state file
        run: |
          git config user.name "aura-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add aura_tracker_state.json
          git diff --cached --quiet || git commit -m "Update tracker state [skip ci]"
          git push
